version: '3.8'

services:
  marsl:
    build: .
    container_name: marsl
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
      - BACKUP_DIR=/app/backups
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - HOP_SECRET=${HOP_SECRET:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: Redis for caching (uncomment to enable)
