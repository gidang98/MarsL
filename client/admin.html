<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarsL Admin Dashboard</title>
<link href="/fonts.css" rel="stylesheet">
<style>
:root { --ink: #2a1630; --paper: #fff6ea; --accent: #ffd23f; --red: #ff5a5f; --green: #3ccf6e; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px; font-family: "Barlow", sans-serif; color: var(--ink);
  background: linear-gradient(#2a1630, #5b2333 60%, #a8452a); min-height: 100vh;
}
.wrap { max-width: 1200px; margin: 0 auto; }
h1 { font-family: "Chakra Petch", sans-serif; font-weight: 400; color: #fff; margin: 4px 0 14px; letter-spacing: 1px; }
h1 small { font-family: "Barlow", sans-serif; font-size: 14px; opacity: 0.7; margin-left: 8px; }
h2 { font-family: "Chakra Petch", sans-serif; font-weight: 400; margin: 0 0 10px; font-size: 22px; }
h3 { font-family: "Chakra Petch", sans-serif; font-weight: 400; margin: 14px 0 8px; font-size: 17px; }
.panel { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); padding: 14px; margin-bottom: 16px; }
.grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.stat { background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px; }
.stat b { display: block; font-size: 22px; font-family: "Chakra Petch", sans-serif; font-weight: 400; }
.stat small { font-weight: 600; opacity: 0.7; }
.btn {
  font-family: inherit; font-weight: 700; font-size: 14px; padding: 7px 12px; cursor: pointer;
  background: var(--accent); color: var(--ink); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink);
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.ghost { background: #fff; }
.btn.red { background: var(--red); color: #fff; }
.btn.small { font-size: 12px; padding: 3px 8px; box-shadow: 0 2px 0 var(--ink); }
input, textarea, select {
  font-family: inherit; font-size: 15px; padding: 7px 9px; border: 2px solid var(--ink); border-radius: 10px; width: 100%;
  background: #fff; color: var(--ink);
}
label { font-weight: 700; font-size: 13px; display: block; margin: 8px 0 3px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.hint { font-size: 12px; opacity: 0.75; margin: 6px 0 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; opacity: 0.6; padding: 4px; }
td { padding: 6px 4px; border-top: 1px dashed rgba(42,22,48,0.25); vertical-align: middle; }
td .btn { margin: 2px 2px 2px 0; }
.tag { font-size: 11px; font-weight: 700; padding: 0 6px; border: 1.5px solid var(--ink); border-radius: 8px; margin-left: 4px; display: inline-block; }
.tag.on { background: #c9f7b4; }
.tag.ban { background: var(--red); color: #fff; }
.tag.off { background: #e8e0d8; }
.tablewrap { overflow-x: auto; }
#toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 10px 16px; font-weight: 700;
  background: var(--ink); color: #fff; border-radius: 14px; display: none; max-width: 90%; z-index: 9;
}
.center { text-align: center; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; position: sticky; top: 0; z-index: 5; padding: 6px 0; background: rgba(42,22,48,0.92); border-radius: 14px; }
.tab { font-family: inherit; font-weight: 700; font-size: 14px; padding: 7px 12px; cursor: pointer; background: #fff6ea; color: var(--ink); border: 2px solid var(--ink); border-radius: 12px; opacity: 0.75; }
.tab.on { background: var(--accent); opacity: 1; box-shadow: 0 3px 0 var(--ink); }
.search { max-width: 260px; margin-bottom: 8px; }
.switch { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-weight: 700; }
.switch input { width: auto; }
.pagination { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.pagination button { min-width: 32px; text-align: center; }
.danger { border-color: var(--red); }
.danger h2 { color: #b3262b; }
.modal-overlay {
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: rgba(42,22,48,0.85); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--paper); border: 3px solid var(--ink); border-radius: 18px;
  max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 0 8px 0 var(--ink);
}
.modal-header { padding: 14px 18px; border-bottom: 2px dashed rgba(42,22,48,0.25); display: flex; justify-content: space-between; align-items: center; }
.modal-header h2 { font-size: 18px; margin: 0; }
.modal-close { background: none; border: none; font-size: 22px; color: var(--ink); cursor: pointer; font-weight: 700; }
.modal-body { padding: 16px 18px; }
.modal-footer { padding: 12px 18px; border-top: 2px dashed rgba(42,22,48,0.25); display: flex; justify-content: flex-end; gap: 8px; }
@media (max-width: 600px) { .tab { padding: 6px 9px; font-size: 13px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠️ MarsL Admin <small>v2 Dashboard</small> <small style="opacity:.5;font-size:11px">Server Management & Moderation</small></h1>

  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="overview">📊 Overview</button>
    <button class="tab" data-tab="players">👤 Players</button>
    <button class="tab" data-tab="logs">📜 Logs</button>
    <button class="tab" data-tab="database">🗄️ Database</button>
    <button class="tab" data-tab="tools">🔧 Tools</button>
  </div>

  <div id="app"></div>
</div>

<div id="toast"></div>

<!-- Player Detail Modal -->
<div class="modal-overlay" id="playerModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Player Details</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter">
      <button class="btn ghost" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
var ADMIN_TOKEN = localStorage.getItem('adminToken') || '';
var currentTab = 'overview';
var currentPage = 1;

function esc(t) {
  return String(t).replace(/[&<>"']/g, function(c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function() { t.style.display = 'none'; }, 3500);
}
function ago(ts) {
  if (!ts) return 'never';
  var m = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  if (m < 2) return 'just now';
  if (m < 60) return m + ' min ago';
  if (m < 1440) return Math.round(m / 60) + ' h ago';
  return Math.round(m / 1440) + ' days ago';
}

function api(path, opts) {
  if (!ADMIN_TOKEN) {
    ADMIN_TOKEN = prompt('Enter admin token:');
    if (ADMIN_TOKEN) localStorage.setItem('adminToken', ADMIN_TOKEN);
  }
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers['x-admin-token'] = ADMIN_TOKEN;
  if (opts.body && typeof opts.body === 'object') {
    opts.body = JSON.stringify(opts.body);
    opts.headers['Content-Type'] = 'application/json';
  }
  return fetch(path, opts).then(function(r) {
    return r.json().then(function(d) {
      if (!r.ok) { toast('⚠️ ' + (d.error || 'Something went wrong')); throw new Error(d.error); }
      return d;
    });
  }).catch(function(e) {
    if (e.message && e.message !== 'Something went wrong') toast('⚠️ ' + e.message);
    throw e;
  });
}

function setApp(h) { document.getElementById('app').innerHTML = h; }

// Tabs
document.querySelectorAll('.tab').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('on'); });
    btn.classList.add('on');
    currentTab = btn.dataset.tab;
    try { localStorage.setItem('adminTab', currentTab); } catch(e){}
    renderTab();
  });
});
try { var saved = localStorage.getItem('adminTab'); if (saved) { currentTab = saved; document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', t.dataset.tab===saved); }); } } catch(e){}

function renderTab() {
  if (currentTab === 'overview') renderOverview();
  else if (currentTab === 'players') renderPlayers();
  else if (currentTab === 'logs') renderLogs();
  else if (currentTab === 'database') renderDatabase();
  else if (currentTab === 'tools') renderTools();
}

// ===== OVERVIEW =====
function renderOverview() {
  setApp('<div class="panel">Loading overview...</div>');
  api('/api/admin/overview').then(function(d) {
    var uptime = Math.floor(d.uptime / 3600) + 'h ' + Math.floor((d.uptime % 3600) / 60) + 'm';
    var dbSize = d.dbSize ? (d.dbSize / 1024 / 1024).toFixed(1) + ' MB' : 'N/A';

    var h = '<div class="panel"><h2>📊 Server Overview</h2>';
    h += '<p class="hint">Uptime: <b>' + uptime + '</b> &middot; Database: <b>' + dbSize + '</b></p>';
    h += '<div class="stats">';
    h += '<div class="stat"><small>👤 Players</small><b>' + d.counts.users + '</b></div>';
    h += '<div class="stat"><small>🏘️ Colonies</small><b>' + d.counts.colonies + '</b></div>';
    h += '<div class="stat"><small>⚔️ Active Moves</small><b>' + d.counts.activeMovements + '</b></div>';
    h += '<div class="stat"><small>📨 Reports</small><b>' + d.counts.reports + '</b></div>';
    h += '<div class="stat"><small>🤝 Alliances</small><b>' + d.counts.alliances + '</b></div>';
    h += '<div class="stat"><small>🔌 WS Conn</small><b>' + d.websocket.totalConnections + '</b></div>';
    h += '</div></div>';

    h += '<div class="grid">';
    h += '<div class="panel"><h2>🧠 Memory</h2><div class="stats">';
    h += '<div class="stat"><small>RSS</small><b>' + d.memory.rss + ' MB</b></div>';
    h += '<div class="stat"><small>Heap Used</small><b>' + d.memory.heapUsed + ' MB</b></div>';
    h += '<div class="stat"><small>Heap Total</small><b>' + d.memory.heapTotal + ' MB</b></div>';
    h += '</div></div>';

    h += '<div class="panel"><h2>📡 WebSocket</h2><div class="stats">';
    h += '<div class="stat"><small>Total Conn</small><b>' + d.websocket.totalConnections + '</b></div>';
    h += '<div class="stat"><small>Auth Users</small><b>' + d.websocket.authenticatedUsers + '</b></div>';
    h += '</div></div>';
    h += '</div>';

    h += '<div class="panel"><h2>💾 Cache</h2>';
    h += '<p><b>Backend:</b> ' + esc(d.cache.backend) + ' &middot; <b>Entries:</b> ' + (d.cache.memoryEntries || 0) + '</p>';
    h += '</div>';

    setApp(h);
  });
}

// ===== PLAYERS =====
function renderPlayers(page) {
  page = page || 1;
  currentPage = page;
  var search = document.getElementById && document.getElementById('psearch') ? document.getElementById('psearch').value : '';
  setApp('<div class="panel">Loading players...</div>');

  var url = '/api/admin/players?page=' + page + '&limit=50';
  if (search) url += '&search=' + encodeURIComponent(search);

  api(url).then(function(d) {
    var h = '<div class="panel"><h2>👤 Players</h2>';
    h += '<div class="row"><input type="text" id="psearch" class="search" placeholder="Search players..." value="' + esc(search) + '"><button class="btn" onclick="renderPlayers(1)">🔍 Search</button></div>';
    h += '<div class="tablewrap"><table><tr><th>ID</th><th>Username</th><th>Colonies</th><th>Reports</th><th>Last Seen</th><th>Status</th><th>Actions</th></tr>';
    d.players.forEach(function(p) {
      var status = p.banned ? '<span class="tag ban">Banned</span>' :
        (p.lastSeen && (Date.now() - new Date(p.lastSeen).getTime() < 300000) ? '<span class="tag on">Online</span>' : '<span class="tag off">Offline</span>');
      h += '<tr><td>' + p.id + '</td><td><b>' + esc(p.username) + '</b></td><td>' + p.colonies + '</td><td>' + p.reports + '</td>';
      h += '<td>' + ago(p.lastSeen) + '</td><td>' + status + '</td>';
      h += '<td><button class="btn small ghost" onclick="viewPlayer(' + p.id + ')">View</button>';
      if (p.banned) {
        h += ' <button class="btn small ghost" onclick="unbanPlayer(' + p.id + ')">Unban</button>';
      } else {
        h += ' <button class="btn small red" onclick="banPlayer(' + p.id + ')">Ban</button>';
      }
      h += '</td></tr>';
    });
    h += '</table></div>';

    // Pagination
    h += '<div class="pagination">';
    if (d.page > 1) h += '<button class="btn small ghost" onclick="renderPlayers(' + (d.page - 1) + ')">&larr;</button>';
    for (var i = Math.max(1, d.page - 2); i <= Math.min(d.pages, d.page + 2); i++) {
      h += '<button class="btn small ' + (i === d.page ? '' : 'ghost') + '" onclick="renderPlayers(' + i + ')">' + i + '</button>';
    }
    if (d.page < d.pages) h += '<button class="btn small ghost" onclick="renderPlayers(' + (d.page + 1) + ')">&rarr;</button>';
    h += '</div>';
    h += '</div>';
    setApp(h);
    // Restore focus
    var inp = document.getElementById('psearch');
    if (inp) { inp.value = search; inp.focus(); }
  });
}

function viewPlayer(id) {
  api('/api/admin/players/' + id).then(function(p) {
    document.getElementById('modalTitle').textContent = esc(p.username);
    var h = '<p><b>ID:</b> ' + p.id + ' &middot; <b>Created:</b> ' + new Date(p.created_at).toLocaleString() + ' &middot; <b>Last Seen:</b> ' + new Date(p.last_seen).toLocaleString() + '</p>';

    if (p.stats && Object.keys(p.stats).length > 0) {
      h += '<h3>⚔️ Combat Stats</h3><div class="stats">';
      h += '<div class="stat"><small>Atk Kills</small><b>' + (p.stats.atk_kills || 0) + '</b></div>';
      h += '<div class="stat"><small>Def Kills</small><b>' + (p.stats.def_kills || 0) + '</b></div>';
      h += '<div class="stat"><small>NPC Kills</small><b>' + (p.stats.npc_kills || 0) + '</b></div>';
      h += '<div class="stat"><small>Wins</small><b>' + (p.stats.wins || 0) + '</b></div>';
      h += '<div class="stat"><small>Battles</small><b>' + (p.stats.battles || 0) + '</b></div>';
      h += '<div class="stat"><small>Loot</small><b>' + (p.stats.loot || 0) + '</b></div>';
      h += '</div>';
    }

    if (p.colonies && p.colonies.length) {
      h += '<h3>🏘️ Colonies</h3><ul style="margin:0 0 0 18px; line-height:1.8;">';
      p.colonies.forEach(function(c) {
        h += '<li>' + esc(c.name) + ' (' + c.x + ', ' + c.y + ') &mdash; ' + esc(c.tribe || 'human') + '</li>';
      });
      h += '</ul>';
    }

    if (p.alliance) {
      h += '<h3>🤝 Alliance</h3><p>' + esc(p.alliance.name) + ' [' + esc(p.alliance.tag) + '] &mdash; ' + esc(p.alliance.role) + '</p>';
    }

    if (p.badges && p.badges.length) {
      h += '<h3>🏅 Badges</h3><p>' + p.badges.map(function(b) { return b.icon + ' ' + esc(b.title); }).join(' &middot; ') + '</p>';
    }

    if (p.reports && p.reports.length) {
      h += '<h3>📨 Recent Reports</h3><div class="tablewrap"><table><tr><th>Title</th><th>Date</th><th>Seen</th></tr>';
      p.reports.forEach(function(r) {
        h += '<tr><td>' + esc(r.title) + '</td><td>' + new Date(r.created_at).toLocaleString() + '</td><td>' + (r.seen ? '✅' : '⬜') + '</td></tr>';
      });
      h += '</table></div>';
    }

    document.getElementById('modalBody').innerHTML = h;
    document.getElementById('modalFooter').innerHTML =
      (p.banned
        ? '<button class="btn" onclick="unbanPlayer(' + p.id + '); closeModal();">👑 Unban</button>'
        : '<button class="btn red" onclick="banPlayer(' + p.id + '); closeModal();">🚫 Ban</button>') +
      '<button class="btn ghost" onclick="closeModal()">Close</button>';
    document.getElementById('playerModal').classList.add('show');
  });
}

function banPlayer(id) {
  if (!confirm('Ban this player?')) return;
  api('/api/admin/players/' + id + '/ban', { method: 'POST', body: { reason: 'Administrative action' } })
    .then(function() { toast('🚫 Player banned'); renderPlayers(currentPage); });
}
function unbanPlayer(id) {
  api('/api/admin/players/' + id + '/unban', { method: 'POST' })
    .then(function() { toast('👑 Player unbanned'); renderPlayers(currentPage); });
}
function closeModal() {
  document.getElementById('playerModal').classList.remove('show');
}

// ===== LOGS =====
function renderLogs() {
  setApp('<div class="panel">Loading logs...</div>');
  api('/api/admin/logs?lines=100').then(function(d) {
    var h = '<div class="panel"><h2>📜 Server Logs</h2>';
    if (!d.lines || !d.lines.length) {
      h += '<p class="hint">No logs yet.</p>';
    } else {
      h += '<div class="tablewrap"><table><tr><th>Time</th><th>Level</th><th>Message</th></tr>';
      d.lines.forEach(function(l) {
        var ts = l.timestamp ? new Date(l.timestamp).toLocaleTimeString() : '--:--:--';
        var lvl = (l.level || 'info').toUpperCase();
        var lvlColor = lvl === 'ERROR' ? 'color:#b3262b;font-weight:700' : lvl === 'WARN' ? 'color:#a67c00;font-weight:700' : 'color:#5c79c9;font-weight:700';
        h += '<tr><td style="white-space:nowrap">' + ts + '</td><td style="' + lvlColor + '">' + lvl + '</td><td>' + esc(l.message || l.raw || '') + '</td></tr>';
      });
      h += '</table></div>';
    }
    h += '<div class="row"><button class="btn" onclick="renderLogs()">🔄 Refresh</button></div>';
    h += '</div>';
    setApp(h);
  });
}

// ===== DATABASE =====
function renderDatabase() {
  setApp('<div class="panel">Loading database stats...</div>');
  Promise.all([
    api('/api/admin/db-stats'),
    api('/api/admin/migrations')
  ]).then(function(results) {
    var db = results[0], mig = results[1];
    var h = '<div class="grid">';

    h += '<div class="panel"><h2>🗄️ Table Sizes</h2>';
    h += '<div class="tablewrap"><table><tr><th>Table</th><th>Rows</th></tr>';
    db.tables.forEach(function(t) {
      h += '<tr><td>' + esc(t.name) + '</td><td>' + t.rows.toLocaleString() + '</td></tr>';
    });
    h += '</table></div></div>';

    h += '<div class="panel"><h2>🔄 Migrations</h2>';
    h += '<p><b>Applied:</b> ' + mig.count + '</p>';
    h += '<p><b>Last:</b> ' + esc(mig.last || 'None') + '</p>';
    if (mig.migrations && mig.migrations.length) {
      h += '<div class="tablewrap"><table><tr><th>Name</th><th>Applied</th></tr>';
      mig.migrations.forEach(function(m) {
        h += '<tr><td>' + esc(m.name) + '</td><td>' + new Date(m.applied_at).toLocaleString() + '</td></tr>';
      });
      h += '</table></div>';
    }
    h += '</div>';
    h += '</div>';
    setApp(h);
  });
}

// ===== TOOLS =====
function renderTools() {
  setApp('<div class="panel">Loading tools...</div>');
  api('/api/admin/maintenance').then(function(maint) {
    var h = '<div class="grid">';

    h += '<div class="panel"><h2>📢 Broadcast</h2>';
    h += '<label>Message to all online players</label>';
    h += '<textarea id="bctext" rows="3" placeholder="Enter your announcement..."></textarea>';
    h += '<div class="row"><button class="btn" onclick="sendBroadcast()">📢 Send Broadcast</button></div>';
    h += '</div>';

    h += '<div class="panel"><h2>🔧 Maintenance Mode</h2>';
    h += '<div class="switch"><input type="checkbox" id="maintoggle" ' + (maint.enabled ? 'checked' : '') + ' onchange="toggleMaint(this.checked)"><label for="maintoggle" style="margin:0">Enable maintenance mode</label></div>';
    h += '<p class="hint">When enabled, new players cannot register and existing players see a maintenance notice.</p>';
    h += '</div>';

    h += '</div>';
    setApp(h);
  });
}

function sendBroadcast() {
  var text = document.getElementById('bctext').value.trim();
  if (!text) return;
  api('/api/admin/broadcast', { method: 'POST', body: { text: text } }).then(function(res) {
    toast('📢 Sent to ' + res.sentTo + ' client(s)');
    document.getElementById('bctext').value = '';
  });
}
function toggleMaint(enabled) {
  api('/api/admin/maintenance', { method: 'POST', body: { enabled: enabled } }).then(function() {
    toast(enabled ? '🔧 Maintenance mode ON' : '🔧 Maintenance mode OFF');
  });
}

// Init
renderTab();
setInterval(function() {
  if (currentTab === 'overview') renderOverview();
}, 30000);
</script>
</body>
</html>
