name: Deploy MarsL to AlwaysData

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which server should receive this release?
        required: true
        type: choice
        options:
          - verify
          - all
          - opentest
          - classic
          - speed
        default: verify

permissions:
  contents: read

concurrency:
  group: alwaysdata-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate dependencies
        run: |
          node .github/scripts/validate-deps.js

      - name: Syntax check
        run: |
          test -s server.js
          node --check server.js

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'const GAME_VERSION = "\K[^"]+' server.js)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"

      - name: Configure pinned SSH access
        env:
          AD_DEPLOY_SSH_KEY: ${{ secrets.AD_DEPLOY_SSH_KEY }}
          AD_KNOWN_HOSTS: ${{ secrets.AD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AD_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$AD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/id_ed25519"
          test -s "$HOME/.ssh/known_hosts"

      - name: Deploy selected servers
        if: ${{ inputs.target != 'verify' }}
        env:
          TARGET: ${{ inputs.target }}
          AD_SSH_HOST: ssh-marsl.alwaysdata.net
          AD_SFTP_USER_OPENTEST: marsl_deploy_opentest
          AD_SFTP_USER_CLASSIC: marsl_deply_classic
          AD_SFTP_USER_SPEED: marsl_deploy_speed
          AD_API_TOKEN: ${{ secrets.AD_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          : "${AD_API_TOKEN:?Missing AD_API_TOKEN}"
          case "$TARGET" in
            opentest|all) : "${AD_SFTP_USER_OPENTEST:?Missing OpenTest SFTP user}" ;;
          esac
          case "$TARGET" in
            classic|all) : "${AD_SFTP_USER_CLASSIC:?Missing Classic SFTP user}" ;;
          esac
          case "$TARGET" in
            speed|all) : "${AD_SFTP_USER_SPEED:?Missing Speed SFTP user}" ;;
          esac

          deploy_one() {
            local label="$1" user="$2" site_id="$3"
            echo "Deploying server.js to ${label}"
            printf '%s\n' \
              'put server.js .server.js.deploy-new' \
              'rename .server.js.deploy-new server.js' \
              'chmod 644 server.js' \
              | sftp -q -b - \
                  -i "$HOME/.ssh/id_ed25519" \
                  -o BatchMode=yes \
                  -o ConnectTimeout=20 \
                  -o IdentitiesOnly=yes \
                  -o StrictHostKeyChecking=yes \
                  -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                  "${user}@${AD_SSH_HOST}"

            curl --fail --silent --show-error \
              --connect-timeout 20 --max-time 60 \
              --request POST \
              --user "${AD_API_TOKEN} account=marsl:" \
              "https://api.alwaysdata.com/v1/site/${site_id}/restart/"
            echo "Restart requested for ${label}"
          }

          case "$TARGET" in
            opentest|all) deploy_one "OpenTest" "$AD_SFTP_USER_OPENTEST" "1094171" ;;
          esac
          case "$TARGET" in
            classic|all) deploy_one "Classic" "$AD_SFTP_USER_CLASSIC" "1098921" ;;
          esac
          case "$TARGET" in
            speed|all) deploy_one "Speed" "$AD_SFTP_USER_SPEED" "1098812" ;;
          esac

      - name: Verify deployment
        if: ${{ inputs.target != 'verify' }}
        env:
          TARGET: ${{ inputs.target }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          verify_one() {
            local label="$1" url="$2"
            local attempt=0 max=15
            while [[ $attempt -lt $max ]]; do
              attempt=$((attempt + 1))
              echo "  [$attempt/$max] Checking ${label}..."
              if response=$(curl --fail --silent --max-time 10 "$url" 2>/dev/null); then
                version=$(echo "$response" | grep -oP '"version":"\K[^"]+' || echo "unknown")
                id=$(echo "$response" | grep -oP '"(id|server)":"\K[^"]+' || echo "unknown")
                if [[ "$version" == "$EXPECTED_VERSION" ]]; then
                  echo "  ✅ ${label}: version=${version}, id=${id}"
                  return 0
                else
                  echo "  ⚠️ ${label}: version=${version} (expected ${EXPECTED_VERSION})"
                fi
              else
                echo "  ⏳ ${label}: not responding yet"
              fi
              sleep 8
            done
            echo "  ❌ ${label}: failed to verify within ${max} attempts"
            return 1
          }

          fail=0
          case "$TARGET" in
            opentest|all)
              verify_one "OpenTest" "https://marsl-game.com/api/config" || fail=1
              ;;
          esac
          case "$TARGET" in
            classic|all)
              verify_one "Classic" "https://classic.marsl-game.com/api/config" || fail=1
              ;;
          esac
          case "$TARGET" in
            speed|all)
              verify_one "Speed" "https://speed.marsl-game.com/api/config" || fail=1
              ;;
          esac

          if [[ $fail -eq 1 ]]; then
            echo ""
            echo "❌ Deployment verification failed. Some servers did not come back online."
            exit 1
          fi

          echo ""
          echo "🚀 All servers verified successfully with version ${EXPECTED_VERSION}!"

      - name: Verify access only (no deploy)
        if: ${{ inputs.target == 'verify' }}
        env:
          AD_API_TOKEN: ${{ secrets.AD_API_TOKEN }}
        run: |
          set -euo pipefail
          for entry in "$AD_SFTP_USER_OPENTEST:1094171" "$AD_SFTP_USER_CLASSIC:1098921" "$AD_SFTP_USER_SPEED:1098812"; do
            user="${entry%:*}"
            site_id="${entry#*:}"
            printf '%s\n' 'ls -l server.js' | sftp -q -b - \
              -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o ConnectTimeout=20 \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "${user}@${AD_SSH_HOST}"
            curl --fail --silent --show-error --max-time 30 --output /dev/null \
              --user "${AD_API_TOKEN} account=marsl:" \
              "https://api.alwaysdata.com/v1/site/${site_id}/"
            echo "Verified SFTP and API read access for site ${site_id}"
          done
