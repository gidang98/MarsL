name: Deploy MarsL to AlwaysData

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which server should receive this release?
        required: true
        type: choice
        options:
          - verify
          - all
          - opentest
          - classic
          - speed
        default: verify

env:
  DEPLOY_TARGET: ${{ github.event_name == 'push' && 'all' || inputs.target }}

permissions:
  contents: read

concurrency:
  group: alwaysdata-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'push' && 'all' || inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject stale or divergent source
        if: ${{ env.DEPLOY_TARGET != 'verify' }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor ec4e1bd9272720214f9b09364c9ff27ef1bde935 HEAD

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate dependencies
        run: |
          node .github/scripts/validate-deps.js

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test

      - name: Build and verify the release
        run: |
          node scripts/build-release.js
          node <<'NODE'
          const fs = require('fs'), p = 'dist/server.js';
          const s = fs.readFileSync(p, 'utf8'), old = 'const RELEASE_COMMIT = "local";';
          if (s.split(old).length !== 2) throw Error('missing release commit marker');
          fs.writeFileSync(p, s.replace(old, 'const RELEASE_COMMIT = ' + JSON.stringify(process.env.GITHUB_SHA) + ';'));
          NODE
          node --check dist/server.js
          node scripts/smoke-release.js

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'const GAME_VERSION = "\K[^"]+' dist/server.js)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"

      - name: Reject version downgrades before any upload
        if: ${{ env.DEPLOY_TARGET != 'verify' }}
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          for url in https://marsl-game.com/api/config https://classic.marsl-game.com/api/config https://speed.marsl-game.com/api/config; do
            response=$(curl --fail --silent --show-error --retry 2 --max-time 20 "$url")
            CONFIG="$response" node <<'NODE'
          const c = JSON.parse(process.env.CONFIG);
          const next = process.env.EXPECTED_VERSION;
          const parse = v => {
            if (typeof v !== 'string' || !/^\d+\.\d+\.\d+$/.test(v)) throw Error('Invalid version: ' + v);
            return v.split('.').map(Number);
          };
          const a = parse(next), b = parse(c.version), i = a.findIndex((v,j) => v !== b[j]);
          if (i < 0 ? c.commit !== process.env.GITHUB_SHA : a[i] < b[i]) throw Error('Refusing downgrade or reused version: ' + c.version + ' -> ' + next);
          if (a[0] !== 1 || a[1] !== 0 || a[2] < 576) throw Error('Below recovery floor');
          console.log('Version guard passed: ' + c.version + ' -> ' + next);
          NODE
            live_commit=$(printf '%s' "$response" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).commit || ""')
            if [[ -n "$live_commit" ]]; then
              [[ "$live_commit" =~ ^[0-9a-f]{40}$ ]]
              git merge-base --is-ancestor "$live_commit" HEAD
            fi
          done

      - name: Configure pinned SSH access
        env:
          AD_DEPLOY_SSH_KEY: ${{ secrets.AD_DEPLOY_SSH_KEY }}
          AD_KNOWN_HOSTS: ${{ secrets.AD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AD_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$AD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/id_ed25519"
          test -s "$HOME/.ssh/known_hosts"

      - name: Deploy selected servers
        if: ${{ env.DEPLOY_TARGET != 'verify' }}
        env:
          TARGET: ${{ env.DEPLOY_TARGET }}
          AD_SSH_HOST: ssh-marsl.alwaysdata.net
          AD_SFTP_USER_OPENTEST: marsl_deploy_opentest
          AD_SFTP_USER_CLASSIC: marsl_deply_classic
          AD_SFTP_USER_SPEED: marsl_deploy_speed
          AD_API_TOKEN: ${{ secrets.AD_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          : "${AD_API_TOKEN:?Missing AD_API_TOKEN}"
          case "$TARGET" in
            opentest|all) : "${AD_SFTP_USER_OPENTEST:?Missing OpenTest SFTP user}" ;;
          esac
          case "$TARGET" in
            classic|all) : "${AD_SFTP_USER_CLASSIC:?Missing Classic SFTP user}" ;;
          esac
          case "$TARGET" in
            speed|all) : "${AD_SFTP_USER_SPEED:?Missing Speed SFTP user}" ;;
          esac

          deploy_one() {
            local label="$1" user="$2" site_id="$3"
            echo "Deploying server.js to ${label}"
            printf '%s\n' \
              'put dist/server.js .server.js.deploy-new' \
              'rename .server.js.deploy-new server.js' \
              'chmod 644 server.js' \
              | sftp -q -b - \
                  -i "$HOME/.ssh/id_ed25519" \
                  -o BatchMode=yes \
                  -o ConnectTimeout=20 \
                  -o IdentitiesOnly=yes \
                  -o StrictHostKeyChecking=yes \
                  -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                  "${user}@${AD_SSH_HOST}"

            curl --fail --silent --show-error \
              --connect-timeout 20 --max-time 60 \
              --request POST \
              --user "${AD_API_TOKEN} account=marsl:" \
              "https://api.alwaysdata.com/v1/site/${site_id}/restart/"
            echo "Restart requested for ${label}"
          }

          case "$TARGET" in
            opentest|all) deploy_one "OpenTest" "$AD_SFTP_USER_OPENTEST" "1094171" ;;
          esac
          case "$TARGET" in
            classic|all) deploy_one "Classic" "$AD_SFTP_USER_CLASSIC" "1098921" ;;
          esac
          case "$TARGET" in
            speed|all) deploy_one "Speed" "$AD_SFTP_USER_SPEED" "1098812" ;;
          esac

      - name: Verify deployment
        if: ${{ env.DEPLOY_TARGET != 'verify' }}
        env:
          TARGET: ${{ env.DEPLOY_TARGET }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          verify_one() {
            local label="$1" url="$2"
            local attempt=0 max=20
            while [[ $attempt -lt $max ]]; do
              attempt=$((attempt + 1))
              echo "  [$attempt/$max] Checking ${label}..."
              if response=$(curl --fail --silent --max-time 15 "$url" 2>/dev/null); then
                version=$(echo "$response" | grep -oP '"version":"\K[^"]+' | head -n1 || echo "unknown")
                id=$(echo "$response" | grep -oP '"(id|server)":"\K[^"]+' | head -n1 || echo "unknown")
                commit=$(echo "$response" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).commit || ""')
                if [[ "$version" == "$EXPECTED_VERSION" && "$commit" == "$GITHUB_SHA" ]]; then
                  echo "  ✅ ${label}: version=${version}, id=${id}"
                  return 0
                else
                  echo "  ⚠️ ${label}: version=${version} (expected ${EXPECTED_VERSION})"
                fi
              else
                echo "  ⏳ ${label}: not responding yet"
              fi
              sleep 10
            done
            echo "  ❌ ${label}: failed to verify within ${max} attempts"
            return 1
          }

          # Give servers a moment to begin restarting before we poll
          echo "Waiting 15s for restarts to begin..."
          sleep 15

          fail=0
          case "$TARGET" in
            opentest|all)
              verify_one "OpenTest" "https://marsl-game.com/api/config" || fail=1
              ;;
          esac
          case "$TARGET" in
            classic|all)
              verify_one "Classic" "https://classic.marsl-game.com/api/config" || fail=1
              ;;
          esac
          case "$TARGET" in
            speed|all)
              verify_one "Speed" "https://speed.marsl-game.com/api/config" || fail=1
              ;;
          esac

          if [[ $fail -eq 1 ]]; then
            echo ""
            echo "❌ Deployment verification failed. Some servers did not come back online."
            exit 1
          fi

          echo ""
          echo "🚀 All servers verified successfully with version ${EXPECTED_VERSION}!"

      - name: Verify access only (no deploy)
        if: ${{ env.DEPLOY_TARGET == 'verify' }}
        env:
          AD_API_TOKEN: ${{ secrets.AD_API_TOKEN }}
          AD_SSH_HOST: ssh-marsl.alwaysdata.net
          AD_SFTP_USER_OPENTEST: marsl_deploy_opentest
          AD_SFTP_USER_CLASSIC: marsl_deply_classic
          AD_SFTP_USER_SPEED: marsl_deploy_speed
        run: |
          set -euo pipefail
          for entry in "$AD_SFTP_USER_OPENTEST:1094171" "$AD_SFTP_USER_CLASSIC:1098921" "$AD_SFTP_USER_SPEED:1098812"; do
            user="${entry%:*}"
            site_id="${entry#*:}"
            printf '%s\n' 'ls -l server.js' | sftp -q -b - \
              -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o ConnectTimeout=20 \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "${user}@${AD_SSH_HOST}"
            curl --fail --silent --show-error --max-time 30 --output /dev/null \
              --user "${AD_API_TOKEN} account=marsl:" \
              "https://api.alwaysdata.com/v1/site/${site_id}/"
            echo "Verified SFTP and API read access for site ${site_id}"
          done
