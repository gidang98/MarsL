name: Verify release candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/validate-deps.js
      - run: npm ci
      - run: npm test
      - run: node --check server.js
      - run: node scripts/build-release.js
      - run: node --check dist/server.js
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/smoke-release.js
        env:
          BROWSER_SMOKE: "1"
